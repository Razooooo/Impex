# Déploiement de l'API sur Render (offre gratuite). Le site est déployé séparément sur Vercel.
services:
  - type: web
    name: impex-api
    runtime: docker
    plan: free
    dockerfilePath: ./Back-end/Dockerfile.prod
    dockerContext: ./Back-end
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: TRUST_PROXY
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI # chaîne de connexion MongoDB Atlas
        sync: false
      - key: CLIENT_URL # adresse du site sur Vercel, sans « / » final
        sync: false
